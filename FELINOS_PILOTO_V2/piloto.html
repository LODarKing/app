<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face { font-family: 'Poppins'; font-weight: 900; src: url('fonts/Poppins-Black.ttf'); }
@font-face { font-family: 'Poppins'; font-weight: 800; src: url('fonts/Poppins-ExtraBold.ttf'); }
@font-face { font-family: 'Poppins'; font-weight: 700; src: url('fonts/Poppins-Bold.ttf'); }
@font-face { font-family: 'Poppins'; font-weight: 600; src: url('fonts/Poppins-SemiBold.ttf'); }
html, body { margin: 0; background: #000; }
canvas { display: block; }
</style></head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script src="js/lib.js"></script>
<script src="js/pingo.js"></script>
<script src="js/bigcats.js"></script>
<script src="js/sets.js"></script>
<script src="js/shots.js"></script>
<script src="js/lab.js"></script>
<script>
  window.READY = (async () => {
    for (const w of [600, 700, 800, 900]) await document.fonts.load(`${w} 40px Poppins`);
    return true;
  })();
  window.draw = (t) => { const ctx = document.getElementById('c').getContext('2d'); renderFrame(ctx, t); };
  window.lab = (v, t) => { const ctx = document.getElementById('c').getContext('2d'); renderLab(ctx, v, t || 0); };
  window.png = () => document.getElementById('c').toDataURL('image/png');
</script>
</body></html>
