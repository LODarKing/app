<script>
  // Contrato de render: window.seek(t) desenha o quadro do instante t (função pura do tempo).
  window.ready = (async () => {
    for (const f of ['italic 700 40px InterUI', '700 40px Caveat', '400 40px InterUI', '600 40px InterUI', '700 40px InterUI', '800 40px InterUI', '900 40px InterUI']) await document.fonts.load(f);
    await document.getElementById('insignia').decode(); await document.getElementById('emblema').decode(); await document.getElementById('refMiguel').decode(); await document.getElementById('refLara').decode();
    for (const im of document.querySelectorAll('img[id^=foto_]')) { try { await im.decode(); } catch (e) { /* foto ainda não baixada: o PIP é omitido */ } }
    return true;
  })();
  const ctx = document.getElementById('c').getContext('2d');
  window.seek = (t) => { renderFrame(ctx, t); };
  window.lab = (v, t) => { renderLab(ctx, v, t || 0); };
  window.png = () => document.getElementById('c').toDataURL('image/png');
</script>
