<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face { font-family: 'BarlowC'; font-weight: 800; src: url('fonts/BarlowCondensed-ExtraBold.ttf'); }
@font-face { font-family: 'InterUI'; font-weight: 500; src: url('fonts/Inter-Medium.otf'); }
@font-face { font-family: 'InterUI'; font-weight: 600; src: url('fonts/Inter-SemiBold.otf'); }
@font-face { font-family: 'InterUI'; font-weight: 700; src: url('fonts/Inter-Bold.otf'); }
@font-face { font-family: 'InterUI'; font-weight: 800; src: url('fonts/Inter-ExtraBold.otf'); }
html, body { margin: 0; background: #000; }
canvas { display: block; }
</style></head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script src="timeline.js"></script>
<script src="audio/beats.js"></script>
<script src="js/core.js"></script>
<script src="js/mundo.js"></script>
<script src="js/bussola.js"></script>
<script src="js/legendas.js"></script>
<script src="js/cena01.js"></script>
<script>
  // Contrato de render: window.seek(t) desenha o quadro do instante t (função pura do tempo).
  window.ready = (async () => {
    for (const f of ['800 40px BarlowC', '500 40px InterUI', '600 40px InterUI', '700 40px InterUI', '800 40px InterUI']) await document.fonts.load(f);
    return true;
  })();
  const ctx = document.getElementById('c').getContext('2d');
  window.seek = (t) => { renderFrame(ctx, t); };
  window.png = () => document.getElementById('c').toDataURL('image/png');
</script>
</body></html>
